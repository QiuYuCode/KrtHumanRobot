# 机器人语音助手配置文件
# 敏感字段（API Key 等）不在此文件中，通过环境变量注入：
#   XFYUN_IAT_APPID / _API_KEY / _API_SECRET  — 讯飞云 ASR
#   XFYUN_TTS_APPID / _API_KEY / _API_SECRET  — 讯飞云 TTS
#   LLM_API_KEY                                — LLM / VLM / MiMo TTS（小米云）
#   VLM_API_KEY                                — VLM（可与 LLM_API_KEY 共用）

# --- 模型路径 ---
# 相对路径以 voice_assistant Python 包目录为基准（model/voice_models/ 见 model/README.md）
asr_model_dir: model/voice_models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
kws_model_dir: model/voice_models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
tts_model_dir: model/voice_models/vits-zh-hf-fanchen-C
vad_model_path: model/voice_models/silero_vad.onnx

# --- 唤醒模式 ---
wake_mode: software

# --- 唤醒词 (KWS) ---
kws_keywords_file: model/voice_models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/keywords.txt
kws_keywords_score: 1.0
kws_keywords_threshold: 0.25
kws_num_trailing_blanks: 1

# --- ASR 后端 ---
# "local": 本地 sherpa-onnx 流式识别
# "iflytek_cloud": 讯飞云识别
asr_backend: local
# "streaming": 逐帧上传(40ms)；"endpoint_once": 端点后一次性上传
cloud_asr_strategy: streaming
cloud_asr_fallback_to_local: true

# --- 讯飞云 ASR 配置 ---
iflytek_iat_language: zh_cn
iflytek_iat_domain: iat
iflytek_iat_accent: mandarin
iflytek_iat_eos_ms: 1800
iflytek_iat_ptt: 1
iflytek_iat_audio_format: "audio/L16;rate=16000"
iflytek_iat_encoding: raw
cloud_asr_preroll_seconds: 0.3

# --- TTS 音色 ---
tts_speaker_id: 0
tts_speed: 1.0
tts_volume: 1.5  # 本地 TTS 音量增益，1.0=原始，>1.0 放大
tts_max_chars_per_chunk: 80
tts_sentence_pause: 0.40
tts_clause_pause: 0.15
# "local" | "iflytek_cloud" | "mimo_cloud"
tts_backend: iflytek_cloud
cloud_tts_fallback_to_local: true

# --- 小米 MiMo 云 TTS (复用 llm_base_url / LLM_API_KEY) ---
mimo_tts_model: mimo-v2.5-tts
mimo_tts_voice: mimo_default
mimo_tts_style: |
  用成年男性、略带机械与金属质感的机器人播报口吻朗读，不要夸张情绪, 说话的语速稍微快一点。
mimo_tts_audio_format: wav
mimo_tts_base_url: "https://api.xiaomimimo.com/v1"
mimo_tts_timeout: 30.0

# --- 讯飞云 TTS 配置 ---
iflytek_tts_vcn: x4_yezi
iflytek_tts_aue: raw
iflytek_tts_auf: "audio/L16;rate=16000"
iflytek_tts_speed: 50
iflytek_tts_tte: UTF8
iflytek_tts_request_text_encoding: utf-8
iflytek_tts_max_bytes: 8000

# --- VAD (语音活动检测) ---
vad_threshold: 0.5
vad_min_silence_duration: 0.25
vad_min_speech_duration: 0.25

# --- 音频设备 ---
# 优先按子串匹配设备名；为空则使用系统默认设备
input_device_hint: XFM-DP
output_device_hint: C-Media

# --- 对话 ---
dialog_timeout: 15.0  # 秒，无活动后超时回到 idle
continuous_dialog: false  # false: 每次回复后回到唤醒；true: 唤醒后连续对话
interrupt_min_speech_seconds: 0.6  # TTS 启动后延迟启用打断

# --- 相机 ---
# 后端: "local" (本机 USB) | "http" (远端 FastAPI) | "ros" (rclpy + cv_bridge)
camera_backend: local
default_camera: head   # describe_scene/take_photo/record_video 默认相机

# HTTP 后端 (远端 10.168.1.101 上跑 scripts/remote_camera_server.py)
camera_http_base_url: http://10.168.1.101:8080
camera_http_timeout: 5.0

# ROS 后端 (需要 source /opt/ros/<distro>/setup.bash 后启动 main.py)
camera_ros_node_name: smart_voice_robot_camera_sub
camera_ros_qos_depth: 5
camera_ros_warmup_seconds: 2.0

# 三路相机: head(头部 RealSense) / left_palm(左掌心) / right_palm(右掌心)
# index: 远端 /dev/videoN ; ros_topic: rclpy 订阅话题
cameras:
  head:
    index: /dev/camera_head_rgb
    width: 640
    height: 480
    ros_topic: /camera/color/image_raw
    record_fps: 30.0
  left_palm:
    index: /dev/camera_left
    width: 640
    height: 480
    ros_topic: /left_gripper/image_raw
    record_fps: 30.0
  right_palm:
    index: /dev/camera_right
    width: 640
    height: 480
    ros_topic: /right_gripper/image_raw
    record_fps: 30.0

camera_save_dir: captures
camera_record_seconds: 10.0

# --- 夹爪 ---
gripper_enabled: true
gripper_adapter_type: zlg_mini
gripper_finger_ids: [1, 2, 3]
gripper_control_mode: 85
gripper_default_speed: 500
gripper_speed_close: 280
gripper_speed_open: 240
gripper_open_value: 0
gripper_close_value: 1000
gripper_shake_cycles: 1
gripper_shake_pause_close: 0.55
gripper_shake_pause_open: 0.55
gripper_second_hand_init_delay: 0.5
gripper_inter_finger_delay: 0.04
gripper_post_reset_sleep: 0.45
gripper_exec_delay_ms: 10
gripper_set_safe_current: true
gripper_safe_current: 250
left_gripper:
  adapter_index: 0
  device_id: 1
  has_pressure_sensor: false
right_gripper:
  adapter_index: 1
  device_id: 2
  has_pressure_sensor: false

# --- LLM ---
# provider: "ollama" | "openai" | "deepseek" | "anthropic"
llm_provider: openai
llm_model: mimo-v2.5
llm_base_url: https://token-plan-cn.xiaomimimo.com/v1
llm_max_history: 10
llm_request_timeout: 30.0
llm_system_prompt: |
  你是一个机器人语音助手。回答要求：
  1. 用简短自然的口语化中文回答，像人在说话一样。
  2. 善用逗号断句，避免一口气说完长句子。
  3. 禁止输出 emoji、表情符号、括号注释、markdown 格式。
  4. 禁止输出列表编号，改用自然语言衔接，比如用首先、然后、最后。
  5. 数字用中文读法，比如三百二十，而非320。

# --- VLM (视觉语言模型) ---
# provider: "ollama" | "openai" | "deepseek" | "anthropic"
vlm_provider: openai
vlm_model: mimo-v2.5
vlm_base_url: https://token-plan-cn.xiaomimimo.com/v1
vlm_system_prompt: |
  你是一个机器人的视觉系统。根据图片内容，用中文描述你看到的场景。
  用第一人称：我看到了。
  禁止输出 emoji、表情符号、markdown 格式。

# --- 任务规划器 ---
use_llm_planner: false
planner_system_prompt: |
  你是一个机器人任务规划器。根据用户的自然语言指令，调用合适的工具来完成任务。
  规则：
  1. 如果用户给出多个指令，请按顺序调用多个工具。
  2. 如果用户只是闲聊或提问，直接用简短中文回复，不要调用任何工具。
  3. 夹爪控制必须显式指定 hand=left 或 hand=right，不允许省略。
  4. 不要输出 emoji 表情和其他任何表情符号。

# --- 意图关键词映射 ---
intent_patterns:
  # 更具体的掌心意图放前面，先命中优先
  # back_to_origin: [回到坐标原点, 回到原点, 回原点]
  # arc_welding: [执行弧焊作业, 开始弧焊, 进行弧焊]
  # workbench_status_check: [开启工作台，检查运行状态, 开启工作台检查运行状态, 启动工作台检查运行状态]
  describe_left_palm: [左手摄像头, 用你的左手摄像头, 左爪, 左夹爪, 左掌心, 左手拿, 看看左]
  describe_right_palm: [右手摄像头, 用你的右手摄像头, 右爪, 右夹爪, 右掌心, 右手拿, 看看右]
  describe_scene: [看一下, 看看, 这是什么, 前面有什么, 描述一下, 看到了什么]
  take_photo: [拍照, 拍张照, 拍个照, 拍一张, 照片]
  record_video: [录像, 录制视频, 录视频, 录一段, 摄像, 拍个视频, 拍视频]
  gripper_control: [左手张开, 右手张开, 左手握, 右手握, 动动左手, 动动右手, 左手, 右手, 夹爪]
  robot_arm: [机械臂, 抓取, 拿起, 放下, 进入拖动, 开始拖动, 开启拖动, 退出拖动, 结束拖动, 停止拖动, 拖动动作, 动作组, 回放轨迹, 挥手, 打招呼, 你好, 握手, 敬礼, 敬个礼]
  introduce_self: [介绍一下你自己, 介绍一下机器人, 介绍一下自己, 你是谁, 你能做什么]
  introduce_krt: [介绍一下湖南科瑞特, 介绍湖南科瑞特]
  navigation: [导航, 前往, 去, 带我去]
  exit: [没事了, 拜拜, 再见]

# --- 机械臂示教 ---
robot_arm_enabled: true
robot_arm_robot: nero
robot_arm_comm: can
robot_arm_firmware: v111
robot_arm_channels:
  left: can_left
  right: can_right
robot_arm_teach_save_dir: captures/arm_teach
robot_arm_teach_file_template: "{arm}_teach_records.json"
robot_arm_sample_interval_s: 0.005
robot_arm_replay_speed_percent: 30
robot_arm_replay_use_timing: true
robot_arm_replay_min_interval_s: 0.003
robot_arm_replay_send_retries: 5
robot_arm_replay_retry_backoff_s: 0.01
robot_arm_replay_max_seconds: 120.0
robot_arm_replay_max_frames: 3000
robot_arm_replay_min_delta_rad: 0.002
robot_arm_joint_limits:
  - [-3.2, 3.2]
  - [-2.8, 2.8]
  - [-2.8, 2.8]
  - [-1.012291, 2.146755]
  - [-3.2, 3.2]
  - [-3.2, 3.2]
  - [-3.2, 3.2]
robot_arm_enable_timeout: 10.0
# 掌心 VLM 前预置：先回放 captures/arm_teach/{arm}_teach_records.json 里对应动作组
describe_left_palm_preset_group: "看一看"
describe_left_palm_preset_arm_side: left
describe_right_palm_preset_group: "看一看"
describe_right_palm_preset_arm_side: right
describe_left_palm_preset_wait_replay_finish: false
describe_left_palm_preset_capture_delay_s: 7
describe_right_palm_preset_wait_replay_finish: false
describe_right_palm_preset_capture_delay_s: 7

# --- 机械臂关键词动作组映射 ---
# 命中后统一分发到 run_group，priority 越大越优先；同优先级按关键词长度匹配
robot_arm_keyword_actions:
  - keywords: [挥手, 打招呼]
    arm_side: left
    group_name: 挥手
    response_text: ""
    priority: 100
  - keywords: [你好]
    arm_side: left
    group_name: 挥手
    response_text: 你好，很高兴见到你。
    priority: 120
  - keywords: [握手]
    arm_side: left
    group_name: 握手
    response_text: 你好，很高兴见到你。
    priority: 100
  - keywords: [敬礼, 敬个礼]
    arm_side: right
    group_name: 敬礼
    response_text: ""
    priority: 100

# --- TTS 响应模板 ---
tts_responses:
  wakeup: 我在，请说。
  timeout: 没有听到您的命令，有需要可以再叫我。
  back_to_origin: 好的，正在回到坐标原点。
  arc_welding: 正在执行弧焊作业，请注意安全。
  workbench_status_check: 好的，正在启动工作台，检查运行状态。
  gripper_missing_side: 请说明左手还是右手。
  introduce_self: 我是湖南科瑞特科技的机器人小特，我可以通过自然语言和你对话。我支持关键词指令和大模型多指令规划，可配合相机、机械臂、导航等模块，完成拍照、录像、场景描述、机械臂控制和自然对话等任务。我有两个7轴协作机械臂，两个三指灵巧手，三个摄像头一个在我的头部，另外两个在我的手上，还有灵活的移动底盘搭配3D激光雷达建图，去哪儿都行。
  introduce_krt: 湖南科瑞特科技有限公司创立于2004年，是一家以人工智能技术、机器人技术、物联网技术等先进技术为核心，集产品研究开发、生产制造、市场营销、工程服务及技术培训为一体，为工业企业、科研院所、高校与职校等在人工智能及应用、智能机器人、工业机器人与智能制造、集成电路设计制造与封测、电子工艺与制造、无人机及应用等泛人工智能领域提供整体解决方案的专业提供商。公司为国家级高新技术企业、信息化建设重点试点企业、智能制造示范企业、省级专精特新小巨人企业；公司已通过ISO9001国际质量管理体系认证、ISO14001国际环境管理体系认证、ISO45001职业健康安全管理体系认证、GB/T 23001与GB/T 23006两化融合管理体系认证；在科技创新方面，公司先后获得80多项专利与软件著作权等自主知识产权，30多个科技项目获得部级、省市级重大、重点项目认定。公司在全国共设立15个办事处，拥有150家以上合作伙伴、1400家以上终端客户，经营与服务网络覆盖全国各省市。
interrupt_wakeup_responses:
  - 我在，请说。
  - 唉，我在。
  - 怎么了。

# --- 启动提示音 ---
startup_sound_enabled: true
startup_sound_text: 系统启动完成

# --- 系统 ---
tick_interval: 0.05  # 主循环心跳间隔 (秒)
num_threads: 5       # 模型推理线程数
onnx_provider: cpu   # ONNX 推理设备: "cuda" | "cpu"
verbose: true

# --- 日志 ---
log_dir: logs
log_retention: 7 days
log_level: DEBUG

# --- py_trees_ros 监控 ---
enable_monitor: false
