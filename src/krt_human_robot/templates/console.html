<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KRT Robot Console</title>
  <style>
    :root{font-family:"Helvetica Neue","Microsoft YaHei",Arial,sans-serif;color:#202124;background:#f7f7f8;letter-spacing:0;--blue:#002fa7;--line:#dfe1e5;--muted:#5f6368;--sidebar:256px}
    *{box-sizing:border-box}body{margin:0;background:#f7f7f8}button,input,select,textarea{font:inherit}
    button{min-height:40px;border:1px solid #c7c9ce;background:#fff;color:#202124;padding:8px 16px;border-radius:20px;cursor:pointer;transition:background .16s,color .16s,border-color .16s}
    button:hover{background:#f7f7f8;border-color:#8b8e94}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b8c8f7;outline-offset:2px}
    button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.primary:hover{background:#001f73}button.danger{color:#b3261e;border-color:#e1b6b2}
    button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{min-height:40px;border:1px solid #aeb1b7;border-radius:4px;padding:8px 12px;background:#fff;color:#202124}
    input:hover,select:hover,textarea:hover{border-color:#5f6368}input:focus,select:focus,textarea:focus{border-color:var(--blue)}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);z-index:4;display:flex;flex-direction:column}
    .brand{height:76px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line)}.brand h1{font-size:19px;line-height:1.2;margin:0;font-weight:700}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:4px}
    nav{display:grid;gap:4px;padding:20px 12px}nav button{position:relative;width:100%;height:52px;border:0;border-radius:4px;background:transparent;color:#3c4043;display:grid;grid-template-columns:24px 1fr 24px;align-items:center;gap:14px;padding:0 14px;text-align:left}
    nav button::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:4px;background:transparent}nav button:hover{background:#f7f7f8}nav button.active{background:#edf1ff;color:var(--blue);font-weight:700}nav button.active::before{background:var(--blue)}
    nav svg{width:22px;height:22px;fill:currentColor}.nav-index{font-size:11px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}nav button.active .nav-index{color:var(--blue)}
    .shell{min-height:100vh;margin-left:var(--sidebar)}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:3}.topbar-title{font-size:14px;color:var(--muted)}
    .status{margin-left:auto;font-size:14px;display:flex;gap:12px;align-items:center}.status-state{display:flex;align-items:center;gap:8px;font-weight:700}.status-state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}#who{padding-left:12px;border-left:1px solid var(--line)}
    .menu-btn{display:none;width:44px;min-height:44px;padding:10px;border:0;border-radius:50%;margin-right:10px}.menu-btn svg{width:24px;height:24px;fill:currentColor}
    main{max-width:1500px;margin:0 auto;padding:28px}.view{display:none}.view.active{display:block}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.toolbar h2{font-size:28px;letter-spacing:-.02em;margin:0 auto 0 0}.toolbar h2::after{content:"";display:block;width:48px;height:3px;background:var(--blue);margin-top:10px}
    .panel,table{background:#fff;border:1px solid var(--line);border-radius:8px}.panel{padding:20px}.grid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px}
    table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}tr:last-child td{border-bottom:0}th{background:#f7f7f8;color:#3c4043;font-size:12px;font-weight:700;letter-spacing:.04em}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:grid;gap:7px;margin-bottom:16px}.field label,.step-fields label{font-size:13px;color:#3c4043}
    .icon-btn{width:40px;padding:8px}.icon-btn svg{width:20px;height:20px;fill:currentColor;display:block;margin:auto}
    .step{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:start}.step:first-child{border-top:0}
    .step-fields{display:flex;gap:10px;flex-wrap:wrap}.step-fields label{display:grid;gap:5px}.step-fields input,.step-fields select{max-width:220px}.parallel{background:#f7f7f8;padding:12px;border-left:4px solid var(--blue);width:100%}
    .gripper-targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.gripper-target{border:1px solid var(--line);padding:16px}.gripper-target h3{margin:0 0 12px}.gripper-target input[type=range]{width:100%}.gripper-target details{margin-top:12px}.gripper-target summary{cursor:pointer;color:var(--blue);font-weight:700}.telemetry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.telemetry-chart{border:1px solid var(--line);padding:12px}.telemetry-chart h3{margin:0 0 8px;font-size:14px}.telemetry-chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}.telemetry-chart-head h3{margin:0}.telemetry-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.telemetry-legend span{display:inline-flex;align-items:center;gap:4px}.telemetry-legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--finger-color)}.telemetry-chart canvas{display:block;width:100%;height:150px}.telemetry-values{overflow-x:auto;margin-top:16px;font-variant-numeric:tabular-nums}
    .gripper-system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.gripper-system-card{border:1px solid var(--line);padding:16px}.gripper-system-card h3{margin:0}.gripper-system-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.state-badge{padding:4px 9px;border-radius:12px;background:#eceff3;font-size:12px}.state-badge.active{background:#d9f3e2;color:#146c35}.state-badge.error{background:#fce2e0;color:#9c1c15}.switches{display:flex;gap:16px;margin:12px 0}.switches label{display:flex;align-items:center;gap:6px}.switches input{min-height:auto}
    .message{position:fixed;right:24px;bottom:24px;padding:14px 18px;background:#202124;color:#fff;border-radius:4px;display:none;max-width:420px;z-index:8}
    .modal{position:fixed;inset:0;background:#202124d9;display:flex;align-items:center;justify-content:center;z-index:9}.modal form{width:min(400px,90vw);background:#fff;padding:32px;border-radius:8px;border-top:5px solid var(--blue)}.modal h2{margin:0 0 24px;font-size:24px}.modal input{width:100%;min-width:0}
    .drawer-scrim{display:none;position:fixed;inset:0;background:#20212480;z-index:3}textarea{width:100%;min-height:100px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
    @media(max-width:800px){.sidebar{transform:translateX(-100%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.drawer-scrim.open{display:block}.shell{margin-left:0}.topbar{height:64px;padding:0 12px}.topbar-title{display:none}.menu-btn{display:grid;place-items:center}.status{gap:8px}.status #who{display:none}.status button{padding:7px 12px}main{padding:16px}.toolbar h2{width:100%;font-size:24px}.grid,.telemetry-grid,.gripper-system-grid{grid-template-columns:1fr}.panel{padding:14px}.view{overflow-x:auto}.step{grid-template-columns:1fr}.step-fields input,.step-fields select{max-width:100%;width:100%}table{min-width:680px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<aside class="sidebar" id="sidebar" aria-label="主导航"><div class="brand"><h1>KRT Robot Console<span>机器人控制台</span></h1></div><nav id="nav"></nav></aside>
<div id="drawerScrim" class="drawer-scrim"></div>
<div class="shell">
<header class="topbar"><button id="menuBtn" class="menu-btn" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button><span class="topbar-title">机器人任务与资源管理</span><div class="status"><span class="status-state" id="execStatus">空闲</span><button id="cancelBtn" class="danger" disabled>停止</button><span id="who"></span><button id="logoutBtn">退出</button></div></header>
<main>
  <section id="waypoints" class="view"><div class="toolbar"><h2>点位</h2><input id="waypointName" placeholder="点位名称"><select id="waypointRoutine"></select><button id="markBtn" class="primary">记录当前位置</button></div><table><thead><tr><th>名称</th><th>位置</th><th>Routine</th><th>操作</th></tr></thead><tbody id="waypointRows"></tbody></table></section>
  <section id="routines" class="view"><div class="toolbar"><h2>动作编排</h2><span id="routineSystemBadge" class="state-badge">未发现</span><button data-robot-control="routine:1">开启服务</button><button data-robot-control="routine:0">关闭服务</button><button id="newRoutine">新建</button><button id="saveRoutine" class="primary">保存</button><button id="runRoutine">试运行</button><button id="deleteRoutine" class="danger">删除</button></div><div class="grid"><div class="panel"><div id="routineList"></div></div><div class="panel"><div class="field"><label>Routine 名称</label><input id="routineName" maxlength="80"></div><div id="steps"></div><div class="actions"><select id="addType"><option value="speak">语音播报</option><option value="play_audio">播放音乐</option><option value="arm_group">机械臂动作</option><option value="gripper">夹爪</option><option value="wait">等待</option><option value="photo">拍照</option><option value="describe">视觉描述</option><option value="parallel">并行组</option></select><button id="addStep">添加步骤</button></div></div></div></section>
  <section id="grippers" class="view"><div class="toolbar"><h2>夹爪动作</h2><button id="newGripper">新建</button><button id="saveGripper" class="primary">保存</button><button id="runGripper">试运行</button><button id="deleteGripper" class="danger">删除</button><button id="monitorGripper">开始监测</button></div><div id="gripperSystem" class="panel" style="margin-bottom:20px"><div class="toolbar"><h3 style="margin:0 auto 0 0">夹爪系统</h3><button id="startAllGrippers" class="primary">开启双手</button><button id="stopAllGrippers">关闭双手</button></div><div class="gripper-system-grid"><article id="leftGripperSystem" class="gripper-system-card"></article><article id="rightGripperSystem" class="gripper-system-card"></article></div></div><div class="grid"><div class="panel"><div id="gripperActionList"></div></div><div class="panel"><div class="field"><label>动作名称</label><input id="gripperName" maxlength="80"></div><div class="step-fields"><label>作用手<select id="gripperSide"><option value="left">左手</option><option value="right">右手</option><option value="both">双手</option></select></label><label>预设<select id="gripperPreset"><option value="custom">自定义</option><option value="open">张开</option><option value="close">闭合</option></select></label></div><div id="gripperTargets" class="gripper-targets"></div><p id="gripperExecution" class="muted"></p></div></div><div class="panel" style="margin-top:20px"><h3>实时调试</h3><p class="muted">左手仅显示位置；压力、切向压力和接近觉由右手传感器提供。</p><div id="gripperTelemetry" class="telemetry-values"></div><div class="telemetry-grid"><div class="telemetry-chart"><h3>手指位置</h3><canvas id="positionChart"></canvas></div><div class="telemetry-chart"><div class="telemetry-chart-head"><h3>法向压力</h3><span class="telemetry-legend"><span data-finger="1" style="--finger-color:#002fa7">手指 1</span><span data-finger="2" style="--finger-color:#e4002b">手指 2</span><span data-finger="3" style="--finger-color:#5f6368">手指 3</span></span></div><canvas id="normalChart"></canvas></div><div class="telemetry-chart"><div class="telemetry-chart-head"><h3>切向压力</h3><span class="telemetry-legend"><span data-finger="1" style="--finger-color:#002fa7">手指 1</span><span data-finger="2" style="--finger-color:#e4002b">手指 2</span><span data-finger="3" style="--finger-color:#5f6368">手指 3</span></span></div><canvas id="tangentChart"></canvas></div><div class="telemetry-chart"><div class="telemetry-chart-head"><h3>接近觉</h3><span class="telemetry-legend"><span data-finger="1" style="--finger-color:#002fa7">手指 1</span><span data-finger="2" style="--finger-color:#e4002b">手指 2</span><span data-finger="3" style="--finger-color:#5f6368">手指 3</span></span></div><canvas id="approachChart"></canvas></div></div></div></section>
  <section id="actionGroups" class="view"><div class="toolbar"><h2>机械臂动作</h2><button class="primary" data-robot-control="arms:1">开启双臂</button><button data-robot-control="arms:0">关闭双臂</button><button data-robot-control="action_group_stack:1">开启动作服务</button><button data-robot-control="action_group_stack:0">关闭动作服务</button></div><div id="robotSystemCards" class="panel gripper-system-grid" style="margin-bottom:20px"></div><div class="panel" style="margin-bottom:20px"><div class="toolbar"><h3 style="margin:0 auto 0 0">示教录制</h3><select id="teachArm"><option value="left">左臂</option><option value="right">右臂</option></select><input id="teachGroupName" maxlength="80" placeholder="动作名称（可选）"><button id="startTeach" class="primary">开始示教</button><button id="stopTeach">停止并保存</button></div><p id="teachState" class="muted">未在示教</p></div><table><thead><tr><th>名称</th><th>机械臂</th><th>采样</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="actionGroupRows"></tbody></table></section>
  <section id="media" class="view"><div class="toolbar"><h2>音乐</h2><input id="mediaFile" type="file" accept="audio/wav,.wav"><button id="uploadMedia" class="primary">上传 WAV</button></div><table><thead><tr><th>名称</th><th>时长</th><th>格式</th><th>大小</th><th>操作</th></tr></thead><tbody id="mediaRows"></tbody></table></section>
  <section id="users" class="view"><div class="toolbar"><h2>账号</h2><input id="newUsername" placeholder="用户名"><input id="newPassword" type="password" placeholder="至少 10 位密码"><select id="newRole"><option value="operator">操作员</option><option value="admin">管理员</option></select><button id="addUser" class="primary">创建</button></div><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table><h3>最近审计</h3><table><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>对象</th><th>结果</th></tr></thead><tbody id="auditRows"></tbody></table></section>
</main>
</div>
<div id="login" class="modal"><form id="loginForm"><h2>登录机器人控制台</h2><div class="field"><label>用户名</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">登录</button></form></div>
<div id="message" class="message"></div>
<script>
let csrf='', user=null, routines=[], media=[], actionGroups=[], gripperActions=[], gripperDefaults=null, selected=null, model={type:'sequence',steps:[]};
let selectedGripper=null, gripperDraft={targets:[]}, gripperMonitoring=false, telemetryPolling=false, telemetryHistory=[], gripperSystemState=null, gripperSystemPolling=false, robotSystems=null, robotSystemPolling=false;
const TELEMETRY_WINDOW_MS=30000;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-CSRF-Token':csrf};if(opt.json!==undefined){opt.body=JSON.stringify(opt.json);opt.headers['Content-Type']='application/json'}const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d}
function msg(text){$('message').textContent=text;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',3000)}
const navIcons={waypoints:'<path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>',routines:'<path d="M7 2h10v2h3v18H4V4h3V2zm2 2v2h6V4H9zm-1 7h8V9H8v2zm0 4h8v-2H8v2zm0 4h5v-2H8v2z"/>',actionGroups:'<path d="M9 2h6v6h-2v3h4a3 3 0 0 1 3 3v8h-2v-8a1 1 0 0 0-1-1h-4v3h2v6H9v-6h2v-3H7a1 1 0 0 0-1 1v8H4v-8a3 3 0 0 1 3-3h4V8H9V2zm2 2v2h2V4h-2zm0 14v2h2v-2h-2z"/>',grippers:'<path d="M7 2h2v8h2V2h2v8h2V4h2v8a5 5 0 0 1-5 5h-1v5H9v-5.35A5 5 0 0 1 5 12V6h2v6a3 3 0 0 0 3 3h2a3 3 0 0 0 3-3h-2v1h-2v-1H9v1H7V2z"/>',media:'<path d="M12 3v10.55A4 4 0 1 0 14 17V7h6V3h-8zm-2 14a2 2 0 1 1-2-2c.74 0 1.39.4 1.73 1H10v1z"/>',users:'<path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-8a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 10c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5zm-6 6v-1c0-1.21 2.34-3 6-3s6 1.79 6 3v1H6z"/>'};
function drawer(open){const mobile=matchMedia('(max-width:800px)').matches;$('sidebar').classList.toggle('open',mobile&&open);$('drawerScrim').classList.toggle('open',mobile&&open);$('menuBtn').setAttribute('aria-expanded',String(mobile&&open));$('sidebar').setAttribute('aria-hidden',String(mobile&&!open))}
function tabs(){const names=[['waypoints','点位'],['actionGroups','机械臂动作'],['grippers','夹爪动作'],['media','音乐'],['routines','动作编排'],...(user?.role==='admin'?[['users','账号']]:[])];$('nav').innerHTML=names.map((x,i)=>`<button data-view="${x[0]}" class="${i?'':'active'}"><svg viewBox="0 0 24 24" aria-hidden="true">${navIcons[x[0]]}</svg><span>${x[1]}</span><span class="nav-index">${String(i+1).padStart(2,'0')}</span></button>`).join('');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(names[0][0]).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.view!=='grippers'&&gripperMonitoring)stopGripperMonitor();document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');drawer(false);if(b.dataset.view==='users')loadUsers()})}
async function boot(){const s=await api('/api/session');csrf=s.csrf_token;user=s.user;$('login').classList.toggle('hidden',!!user);if(!user)return;$('who').textContent=`${user.username} · ${user.role}`;tabs();await refreshAll();setInterval(status,1000)}
async function refreshAll(){[routines,media,actionGroups,gripperActions,gripperDefaults]=await Promise.all([api('/api/routines'),api('/api/media'),api('/api/action-groups'),api('/api/gripper-actions'),api('/api/gripper-defaults')]);renderRoutineList();renderActionGroups();renderGripperList();renderMedia();if(!gripperDraft.targets.length)newGripperDraft();await Promise.all([loadWaypoints(),loadGripperSystem(),loadRobotSystems()])}
async function loadWaypoints(){const rows=await api('/api/waypoints');$('waypointRoutine').innerHTML='<option value="">不绑定动作</option>'+routines.map(r=>`<option>${esc(r.name)}</option>`).join('');$('waypointRows').innerHTML=rows.map(w=>`<tr><td>${esc(w.name)}</td><td>${w.x.toFixed(2)}, ${w.y.toFixed(2)}</td><td><select data-bind="${esc(w.name)}"><option value="">-</option>${routines.map(r=>`<option ${r.name===w.routine?'selected':''}>${esc(r.name)}</option>`).join('')}</select></td><td class="actions"><button data-runwp="${esc(w.name)}">执行</button><button class="danger" data-delwp="${esc(w.name)}">删除</button></td></tr>`).join('');document.querySelectorAll('[data-bind]').forEach(x=>x.onchange=()=>api(`/api/waypoints/${encodeURIComponent(x.dataset.bind)}`,{method:'PATCH',json:{routine:x.value}}).then(()=>msg('绑定已更新')).catch(e=>msg(e.message)));document.querySelectorAll('[data-runwp]').forEach(x=>x.onclick=()=>api(`/api/waypoints/${encodeURIComponent(x.dataset.runwp)}/run`,{method:'POST'}).then(()=>msg('已开始执行')).catch(e=>msg(e.message)));document.querySelectorAll('[data-delwp]').forEach(x=>x.onclick=()=>confirm('删除点位？')&&api(`/api/waypoints/${encodeURIComponent(x.dataset.delwp)}`,{method:'DELETE'}).then(loadWaypoints).catch(e=>msg(e.message)))}
function renderRoutineList(){ $('routineList').innerHTML=routines.map(r=>`<button style="width:100%;margin-bottom:6px;text-align:left" data-routine="${esc(r.name)}">${esc(r.name)}</button>`).join('')||'<span class="muted">暂无 routine</span>';document.querySelectorAll('[data-routine]').forEach(x=>x.onclick=()=>selectRoutine(x.dataset.routine))}
function renderActionGroups(){$('actionGroupRows').innerHTML=actionGroups.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.arm_target)}</td><td>${g.sample_count}</td><td>${esc(g.created_at)}</td><td class="actions"><button data-rungroup="${esc(g.name)}" data-armside="${esc(g.arm_target)}">回放</button><button data-renamegroup="${esc(g.name)}">改名</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无机械臂动作</td></tr>';document.querySelectorAll('[data-renamegroup]').forEach(x=>x.onclick=()=>{const name=prompt('机械臂动作新名称',x.dataset.renamegroup);if(name&&name!==x.dataset.renamegroup)api(`/api/action-groups/${encodeURIComponent(x.dataset.renamegroup)}`,{method:'PATCH',json:{name}}).then(refreshAll).catch(e=>msg(e.message))});document.querySelectorAll('[data-rungroup]').forEach(x=>x.onclick=()=>{let side=x.dataset.armside;if(side==='unknown')side=prompt('请选择机械臂：left / right','left');if(!side)return;api(`/api/action-groups/${encodeURIComponent(x.dataset.rungroup)}/run`,{method:'POST',json:{arm_target:side,repeat_count:1}}).catch(e=>msg(e.message))})}
function renderRobotSystems(){if(!robotSystems)return;const labels={left_arm:'左臂',right_arm:'右臂',action_group_stack:'示教 / 动作组服务',routine:'编排服务'};$('robotSystemCards').innerHTML=Object.entries(robotSystems.components).map(([name,item])=>`<article class="gripper-system-card"><div class="gripper-system-head"><h3>${labels[name]||name}</h3><span class="state-badge ${item.active?'active':''} ${item.error?'error':''}">${item.active?'运行中':item.present?'已关闭':'未发现'}</span></div>${item.error?`<p class="muted">${esc(item.error)}</p>`:''}</article>`).join('');const teaching=robotSystems.teaching||{};$('teachState').textContent=teaching.active?`${teaching.arm_target==='left'?'左臂':'右臂'}正在示教：${teaching.group_name||'未命名'}`:'未在示教';$('startTeach').disabled=!!teaching.active;$('stopTeach').disabled=!teaching.active;const routine=robotSystems.components.routine;$('routineSystemBadge').textContent=routine?.active?'运行中':routine?.present?'已关闭':'未发现';$('routineSystemBadge').classList.toggle('active',!!routine?.active)}
async function loadRobotSystems(){if(robotSystemPolling||!user)return;robotSystemPolling=true;try{robotSystems=await api('/api/robot-systems');renderRobotSystems()}catch(error){robotSystems=null;$('robotSystemCards').innerHTML='<span class="muted">ROS bridge 不可用</span>'}finally{robotSystemPolling=false}}
async function controlRobotSystem(component,enabled){try{await api(`/api/robot-systems/${component}/control`,{method:'POST',json:{enabled}});await loadRobotSystems()}catch(error){msg(error.message);await loadRobotSystems()}}
function selectRoutine(name){const r=routines.find(x=>x.name===name);selected=name;$('routineName').value=name;$('routineName').disabled=true;model=structuredClone(r.spec);renderSteps()}
function fresh(type){if(type==='speak')return{type,text:''};if(type==='play_audio')return{type,media_key:media[0]?.media_key||''};if(type==='arm_group')return{type,arm_target:'left',group_name:'',repeat_count:1};if(type==='gripper')return{type,action_name:gripperActions[0]?.name||''};if(type==='wait')return{type,wait_ms:500};if(type==='describe')return{type,camera_id:'head',question:'请描述你看到的内容'};if(type==='parallel')return{type,steps:[]};return{type}}
function fields(step,i,child=''){const key=`${i}${child}`;const input=(n,v,t='text',min='',max='')=>`<label>${n}<input data-key="${key}" data-field="${n}" type="${t}" value="${esc(v)}" min="${min}" max="${max}"></label>`;if(step.type==='speak')return input('text',step.text);if(step.type==='play_audio')return `<label>media_key<select data-key="${key}" data-field="media_key">${media.map(m=>`<option value="${m.media_key}" ${m.media_key===step.media_key?'selected':''}>${esc(m.display_name)}</option>`).join('')}</select></label>`;if(step.type==='arm_group'){const groups=actionGroups.map(g=>`<option value="${esc(g.name)}" ${g.name===step.group_name?'selected':''}>${esc(g.name)}${g.arm_target==='unknown'?'（请选择机械臂）':''}</option>`).join('');return `<label>机械臂动作<select data-key="${key}" data-field="group_name"><option value="">请选择</option>${groups}</select></label><label>arm_target<select data-key="${key}" data-field="arm_target">${['left','right','both'].map(v=>`<option ${v===step.arm_target?'selected':''}>${v}</option>`).join('')}</select></label>`+input('repeat_count',step.repeat_count,'number',1,100)}if(step.type==='gripper'){if(step.action_name!==undefined)return `<label>夹爪动作<select data-key="${key}" data-field="action_name"><option value="">请选择</option>${gripperActions.map(g=>`<option value="${esc(g.name)}" ${g.name===step.action_name?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>`;return `<label>side<select data-key="${key}" data-field="side"><option ${step.side==='left'?'selected':''}>left</option><option ${step.side==='right'?'selected':''}>right</option></select></label>`+input('finger_id',step.finger_id,'number',0,3)+input('position',step.position,'number',0,1000)+input('speed',step.speed,'number',0,1000)+input('force',step.force,'number',0,255)+input('wait_time',step.wait_time,'number',0,255)}if(step.type==='wait')return input('wait_ms',step.wait_ms,'number',0,3600000);if(step.type==='describe')return input('camera_id',step.camera_id)+input('question',step.question);return''}
function renderSteps(){ $('steps').innerHTML=model.steps.map((s,i)=>`<div class="step"><strong>${esc(s.type)}</strong><div class="step-fields">${fields(s,i)}${s.type==='parallel'?`<div class="parallel">${s.steps.map((c,j)=>`<div class="step"><strong>${esc(c.type)}</strong><div class="step-fields">${fields(c,i,':'+j)}</div><button data-delchild="${i}:${j}">删除</button></div>`).join('')}<select data-paralleltype="${i}"><option value="play_audio">音乐</option><option value="arm_group">机械臂</option><option value="gripper">夹爪</option><option value="wait">等待</option></select><button data-addchild="${i}">添加并行项</button></div>`:''}</div><div class="actions"><button class="icon-btn" data-up="${i}" aria-label="上移"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5H7z"/></svg></button><button class="icon-btn" data-down="${i}" aria-label="下移"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5H7z"/></svg></button><button data-delstep="${i}">删除</button></div></div>`).join('');bindStepEvents()}
function bindStepEvents(){document.querySelectorAll('[data-field]').forEach(x=>x.onchange=()=>{const[a,b]=x.dataset.key.split(':').map(Number),o=Number.isInteger(b)?model.steps[a].steps[b]:model.steps[a];o[x.dataset.field]=x.type==='number'?Number(x.value):x.value;if(x.dataset.field==='group_name'){const group=actionGroups.find(g=>g.name===x.value);if(group&&group.arm_target!=='unknown')o.arm_target=group.arm_target;renderSteps()}});document.querySelectorAll('[data-delstep]').forEach(x=>x.onclick=()=>{model.steps.splice(+x.dataset.delstep,1);renderSteps()});document.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(+x.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(+x.dataset.down,1));document.querySelectorAll('[data-addchild]').forEach(x=>x.onclick=()=>{const i=+x.dataset.addchild,t=document.querySelector(`[data-paralleltype="${i}"]`).value;model.steps[i].steps.push(fresh(t));renderSteps()});document.querySelectorAll('[data-delchild]').forEach(x=>x.onclick=()=>{const[i,j]=x.dataset.delchild.split(':').map(Number);model.steps[i].steps.splice(j,1);renderSteps()})}
function move(i,d){const n=i+d;if(n<0||n>=model.steps.length)return;[model.steps[i],model.steps[n]]=[model.steps[n],model.steps[i]];renderSteps()}
const gripperStateLabels={missing:'未发现',unconfigured:'已关闭',inactive:'已配置',active:'运行中',finalized:'已结束',unknown:'未知'};
function renderGripperSystem(){if(!gripperSystemState)return;for(const side of ['left','right']){const hand=gripperSystemState.hands[side],settings=hand.settings||{},active=hand.lifecycle_state==='active',editable=user?.role==='admin'&&['missing','unconfigured'].includes(hand.lifecycle_state),label=side==='left'?'左手':'右手',badge=hand.error?'故障':(gripperStateLabels[hand.lifecycle_state]||hand.lifecycle_state);$(`${side}GripperSystem`).innerHTML=`<div class="gripper-system-head"><h3>${label}</h3><span class="state-badge ${active?'active':''} ${hand.error?'error':''}">${esc(badge)}</span></div><div class="actions"><button class="primary" data-system-control="${side}:1" ${active?'disabled':''}>开启</button><button data-system-control="${side}:0" ${!hand.present||hand.lifecycle_state==='unconfigured'?'disabled':''}>关闭</button></div><div class="switches"><label><input type="checkbox" data-runtime="${side}:listen_enabled" ${settings.listen_enabled?'checked':''}>监听</label><label><input type="checkbox" data-runtime="${side}:realtime_response_enabled" ${settings.realtime_response_enabled?'checked':''}>实时响应</label></div>${hand.error?`<p class="muted">${esc(hand.error)}</p>`:''}<details><summary>硬件参数${editable?'':'（请先关闭）'}</summary><div class="step-fields"><label>适配器类型<select id="${side}AdapterType" ${editable?'':'disabled'}><option ${settings.adapter_type==='ZLG_MINI'?'selected':''}>ZLG_MINI</option><option ${settings.adapter_type==='ZLG_200U'?'selected':''}>ZLG_200U</option></select></label><label>适配器序号<input id="${side}AdapterIndex" type="number" min="0" max="15" value="${settings.adapter_index??0}" ${editable?'':'disabled'}></label><label>设备 ID<input id="${side}DeviceId" type="number" min="1" max="255" value="${settings.device_id??1}" ${editable?'':'disabled'}></label></div>${user?.role==='admin'?`<button data-save-hardware="${side}" ${editable?'':'disabled'}>保存硬件参数</button>`:''}</details>`}document.querySelectorAll('[data-system-control]').forEach(button=>button.onclick=()=>{const[side,enabled]=button.dataset.systemControl.split(':');controlGripperSystem(side,enabled==='1')});document.querySelectorAll('[data-runtime]').forEach(input=>input.onchange=()=>{const[side,key]=input.dataset.runtime.split(':');api(`/api/gripper/system/${side}/runtime`,{method:'PUT',json:{[key]:input.checked}}).then(loadGripperSystem).catch(error=>msg(error.message))});document.querySelectorAll('[data-save-hardware]').forEach(button=>button.onclick=()=>saveGripperHardware(button.dataset.saveHardware))}
async function loadGripperSystem(){if(gripperSystemPolling||!user)return;gripperSystemPolling=true;try{gripperSystemState=await api('/api/gripper/system');renderGripperSystem()}catch(error){gripperSystemState=null;$('leftGripperSystem').innerHTML='<span class="muted">ROS bridge 不可用</span>';$('rightGripperSystem').innerHTML='<span class="muted">ROS bridge 不可用</span>'}finally{gripperSystemPolling=false}}
async function controlGripperSystem(target,enabled){try{const result=await api('/api/gripper/system/control',{method:'POST',json:{target,enabled}});if(!result.success)msg(Object.values(result.hands).filter(x=>!x.success).map(x=>x.message).join('；'));await loadGripperSystem()}catch(error){msg(error.message);await loadGripperSystem()}}
async function saveGripperHardware(side){try{await api(`/api/gripper/system/${side}/settings`,{method:'PUT',json:{adapter_type:$(`${side}AdapterType`).value,adapter_index:Number($(`${side}AdapterIndex`).value),device_id:Number($(`${side}DeviceId`).value)}});msg('硬件参数已保存');await loadGripperSystem()}catch(error){msg(error.message)}}
function blankGripperTarget(side){return{side,finger_id:0,position:gripperDefaults?.open_position??0,speed:gripperDefaults?.open_speed??240,force:gripperDefaults?.default_force??85,wait_time:gripperDefaults?.default_wait_time??10}}
function newGripperDraft(){selectedGripper=null;$('gripperName').disabled=false;$('gripperName').value='';$('gripperSide').value='left';$('gripperPreset').value='custom';gripperDraft={targets:[blankGripperTarget('left')]};renderGripperTargets()}
function renderGripperList(){$('gripperActionList').innerHTML=gripperActions.map(g=>`<button style="width:100%;margin-bottom:6px;text-align:left" data-gripperaction="${esc(g.name)}">${esc(g.name)}</button>`).join('')||'<span class="muted">暂无夹爪动作</span>';document.querySelectorAll('[data-gripperaction]').forEach(x=>x.onclick=()=>selectGripperAction(x.dataset.gripperaction))}
function selectGripperAction(name){const action=gripperActions.find(x=>x.name===name);selectedGripper=name;$('gripperName').disabled=true;$('gripperName').value=name;gripperDraft={targets:structuredClone(action.targets)};$('gripperSide').value=action.targets.length===2?'both':action.targets[0].side;$('gripperPreset').value='custom';renderGripperTargets()}
function syncGripperSide(){const side=$('gripperSide').value,existing=Object.fromEntries(gripperDraft.targets.map(x=>[x.side,x]));gripperDraft.targets=(side==='both'?['left','right']:[side]).map(x=>existing[x]||blankGripperTarget(x));renderGripperTargets()}
function applyGripperPreset(){const preset=$('gripperPreset').value;if(preset==='custom')return;gripperDraft.targets.forEach(target=>{target.position=preset==='open'?gripperDefaults.open_position:gripperDefaults.close_position;target.speed=preset==='open'?gripperDefaults.open_speed:gripperDefaults.close_speed});renderGripperTargets()}
function renderGripperTargets(){$('gripperTargets').innerHTML=gripperDraft.targets.map(target=>`<div class="gripper-target"><h3>${target.side==='left'?'左手':'右手'}</h3><label>目标位置 <output data-goutput="${target.side}">${target.position}</output><input type="range" min="0" max="1000" value="${target.position}" data-gside="${target.side}" data-gfield="position"></label><details><summary>高级参数</summary><div class="step-fields"><label>手指<select data-gside="${target.side}" data-gfield="finger_id">${[0,1,2,3].map(v=>`<option value="${v}" ${v===target.finger_id?'selected':''}>${v===0?'全部':v}</option>`).join('')}</select></label>${[['speed','速度',0,1000],['force','力度',0,255],['wait_time','等待时间',0,255]].map(([field,label,min,max])=>`<label>${label}<input type="number" min="${min}" max="${max}" value="${target[field]}" data-gside="${target.side}" data-gfield="${field}"></label>`).join('')}</div></details></div>`).join('');document.querySelectorAll('[data-gfield]').forEach(input=>{const update=()=>{const target=gripperDraft.targets.find(x=>x.side===input.dataset.gside);target[input.dataset.gfield]=Number(input.value);if(input.dataset.gfield==='position')document.querySelector(`[data-goutput="${input.dataset.gside}"]`).textContent=input.value};input.oninput=update;input.onchange=update})}
function metricCell(metric){return metric?.available?Number(metric.value).toFixed(2):'<span class="muted">不可用</span>'}
function renderTelemetryValues(snapshot){const rows=[];for(const side of ['left','right'])for(const finger of snapshot.hands[side].fingers)rows.push(`<tr><td>${side==='left'?'左手':'右手'} ${finger.id}</td><td>${metricCell(finger.position)}</td><td>${side==='right'?metricCell(finger.normal_pressure):'-'}</td><td>${side==='right'?metricCell(finger.tangent_pressure):'-'}</td><td>${side==='right'?metricCell(finger.approaching):'-'}</td></tr>`);$('gripperTelemetry').innerHTML=`<table><thead><tr><th>手指</th><th>位置</th><th>法向压力</th><th>切向压力</th><th>接近觉</th></tr></thead><tbody>${rows.join('')}</tbody></table>`}
function chartSeries(side,metric){return[1,2,3].map((finger,index)=>({label:`${side}-${finger}`,color:['#002fa7','#e4002b','#5f6368'][index],values:telemetryHistory.map(sample=>{const item=sample.hands[side].fingers[finger-1][metric];return item?.available?item.value:null})}))}
function plotChart(id,series){const canvas=$(id),ratio=devicePixelRatio||1,width=Math.max(280,canvas.clientWidth),height=150;canvas.width=width*ratio;canvas.height=height*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,width,height);const values=series.flatMap(x=>x.values.filter(Number.isFinite));if(values.length<2)return;let min=Math.min(...values),max=Math.max(...values);if(min===max){min-=1;max+=1}ctx.strokeStyle='#dfe1e5';ctx.strokeRect(.5,.5,width-1,height-1);series.forEach(line=>{ctx.beginPath();ctx.strokeStyle=line.color;ctx.lineWidth=1.5;let started=false;line.values.forEach((value,index)=>{if(!Number.isFinite(value)){started=false;return}const x=index/Math.max(1,telemetryHistory.length-1)*(width-16)+8,y=height-8-(value-min)/(max-min)*(height-16);if(started)ctx.lineTo(x,y);else{ctx.moveTo(x,y);started=true}});ctx.stroke()})}
function drawTelemetry(){plotChart('positionChart',[...chartSeries('left','position'),...chartSeries('right','position')]);plotChart('normalChart',chartSeries('right','normal_pressure'));plotChart('tangentChart',chartSeries('right','tangent_pressure'));plotChart('approachChart',chartSeries('right','approaching'))}
async function pollGripperTelemetry(){if(telemetryPolling||!gripperMonitoring||document.visibilityState!=='visible'||!$('grippers').classList.contains('active'))return;telemetryPolling=true;try{const snapshot=await api('/api/gripper/telemetry');telemetryHistory.push(snapshot);const cutoff=Date.now()-TELEMETRY_WINDOW_MS;telemetryHistory=telemetryHistory.filter(x=>x.timestamp*1000>=cutoff);renderTelemetryValues(snapshot);drawTelemetry()}catch(error){msg(error.message)}finally{telemetryPolling=false}}
async function stopGripperMonitor(){if(!gripperMonitoring)return;gripperMonitoring=false;$('monitorGripper').textContent='开始监测';try{await api('/api/gripper/monitor',{method:'POST',json:{enabled:false}})}catch(error){msg(error.message)}}
function renderMedia(){$('mediaRows').innerHTML=media.map(m=>`<tr><td>${esc(m.display_name)}</td><td>${m.duration_sec.toFixed(1)} 秒</td><td>${m.sample_rate} Hz / ${m.channels} 声道</td><td>${(m.size_bytes/1048576).toFixed(1)} MB</td><td><button class="danger" data-delmedia="${m.media_key}">删除</button></td></tr>`).join('');document.querySelectorAll('[data-delmedia]').forEach(x=>x.onclick=()=>confirm('删除音乐？')&&api(`/api/media/${x.dataset.delmedia}`,{method:'DELETE'}).then(refreshAll).catch(e=>msg(e.message)))}
async function loadUsers(){const [u,a]=await Promise.all([api('/api/users'),api('/api/audit-logs')]);$('userRows').innerHTML=u.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.role}</td><td>${x.enabled?'启用':'禁用'}</td><td><button data-toggle="${x.id}" data-enabled="${x.enabled}">${x.enabled?'禁用':'启用'}</button></td></tr>`).join('');document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>api(`/api/users/${x.dataset.toggle}`,{method:'PATCH',json:{enabled:!Number(x.dataset.enabled)}}).then(loadUsers).catch(e=>msg(e.message)));$('auditRows').innerHTML=a.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.username)}</td><td>${esc(x.action)}</td><td>${esc(x.object_name)}</td><td>${x.success?'成功':'失败'}</td></tr>`).join('')}
async function status(){if(!user)return;const s=await api('/api/execution');$('execStatus').textContent=s.status==='running'?`${s.mode} · ${s.current_step||'执行中'}`:s.status;$('cancelBtn').disabled=s.status!=='running';if(s.mode==='gripper'&&s.hands)$('gripperExecution').textContent=Object.entries(s.hands).map(([side,hand])=>`${side==='left'?'左手':'右手'} ${Math.round((hand.progress||0)*100)}% ${hand.current_positions?.join(', ')||''} ${hand.message||''}`).join(' | ');if($('grippers').classList.contains('active'))loadGripperSystem();if($('actionGroups').classList.contains('active')||$('routines').classList.contains('active'))loadRobotSystems()}

$('startTeach').onclick=()=>api('/api/arm/teach/start',{method:'POST',json:{arm_target:$('teachArm').value,group_name:$('teachGroupName').value}}).then(loadRobotSystems).catch(e=>msg(e.message));
$('stopTeach').onclick=()=>api('/api/arm/teach/stop',{method:'POST',json:{group_name:$('teachGroupName').value}}).then(()=>refreshAll()).catch(e=>msg(e.message));
$('loginForm').onsubmit=e=>{e.preventDefault();api('/api/login',{method:'POST',json:{username:$('loginUser').value,password:$('loginPassword').value}}).then(s=>{csrf=s.csrf_token;user=s.user;$('login').classList.add('hidden');$('who').textContent=`${user.username} · ${user.role}`;tabs();refreshAll();setInterval(status,1000)}).catch(e=>msg(e.message))};$('logoutBtn').onclick=async()=>{await stopGripperMonitor();api('/api/logout',{method:'POST'}).then(()=>location.reload())};$('cancelBtn').onclick=()=>api('/api/execution/cancel',{method:'POST'}).catch(e=>msg(e.message));$('startAllGrippers').onclick=()=>controlGripperSystem('both',true);$('stopAllGrippers').onclick=()=>controlGripperSystem('both',false);$('markBtn').onclick=()=>api('/api/waypoints',{method:'POST',json:{name:$('waypointName').value,routine:$('waypointRoutine').value}}).then(loadWaypoints).catch(e=>msg(e.message));$('newRoutine').onclick=()=>{selected=null;$('routineName').disabled=false;$('routineName').value='';model={type:'sequence',steps:[]};renderSteps()};$('addStep').onclick=async()=>{if($('addType').value==='arm_group')actionGroups=await api('/api/action-groups');model.steps.push(fresh($('addType').value));renderSteps()};$('saveRoutine').onclick=()=>{const n=$('routineName').value.trim();api(`/api/routines/${encodeURIComponent(n)}`,{method:'PUT',json:model}).then(refreshAll).then(()=>selectRoutine(n)).catch(e=>msg(e.message))};$('runRoutine').onclick=()=>api(`/api/routines/${encodeURIComponent($('routineName').value)}/run`,{method:'POST'}).catch(e=>msg(e.message));$('deleteRoutine').onclick=()=>selected&&confirm('删除 routine？')&&api(`/api/routines/${encodeURIComponent(selected)}`,{method:'DELETE'}).then(refreshAll).catch(e=>msg(e.message));$('newGripper').onclick=newGripperDraft;$('gripperSide').onchange=syncGripperSide;$('gripperPreset').onchange=applyGripperPreset;$('saveGripper').onclick=()=>{const name=$('gripperName').value.trim();api(`/api/gripper-actions/${encodeURIComponent(name)}`,{method:'PUT',json:gripperDraft}).then(refreshAll).then(()=>selectGripperAction(name)).catch(e=>msg(e.message))};$('runGripper').onclick=()=>api('/api/gripper/run',{method:'POST',json:gripperDraft}).catch(e=>msg(e.message));$('deleteGripper').onclick=()=>selectedGripper&&confirm('删除夹爪动作？')&&api(`/api/gripper-actions/${encodeURIComponent(selectedGripper)}`,{method:'DELETE'}).then(()=>{newGripperDraft();return refreshAll()}).catch(e=>msg(e.message));$('monitorGripper').onclick=async()=>{if(gripperMonitoring)return stopGripperMonitor();try{await api('/api/gripper/monitor',{method:'POST',json:{enabled:true}});gripperMonitoring=true;telemetryHistory=[];$('monitorGripper').textContent='停止监测';await pollGripperTelemetry()}catch(error){msg(error.message)}};$('uploadMedia').onclick=()=>{const f=$('mediaFile').files[0];if(!f)return msg('请选择 WAV');const d=new FormData();d.append('file',f);api('/api/media',{method:'POST',body:d}).then(refreshAll).catch(e=>msg(e.message))};$('addUser').onclick=()=>api(`/api/users`,{method:'POST',json:{username:$('newUsername').value,password:$('newPassword').value,role:$('newRole').value}}).then(loadUsers).catch(e=>msg(e.message));setInterval(pollGripperTelemetry,500);boot().catch(e=>msg(e.message));
$('menuBtn').onclick=()=>drawer($('menuBtn').getAttribute('aria-expanded')!=='true');$('drawerScrim').onclick=()=>drawer(false);addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});addEventListener('resize',()=>drawer(false));addEventListener('visibilitychange',()=>{if(document.hidden)stopGripperMonitor()});drawer(false);
</script>
</body></html>
