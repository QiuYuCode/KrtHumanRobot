<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KRT Robot Console</title>
  <style>
    :root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#1c252b;background:#eef1f3;letter-spacing:0}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}
    button{border:1px solid #738089;background:#fff;padding:7px 12px;border-radius:5px;cursor:pointer}
    button.primary{background:#116b5b;color:#fff;border-color:#116b5b}button.danger{color:#a62828;border-color:#c98f8f}
    button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{border:1px solid #a9b2b8;border-radius:4px;padding:7px;background:#fff}
    header{height:58px;background:#20282d;color:#fff;display:flex;align-items:center;padding:0 22px;gap:22px}
    header h1{font-size:20px;margin:0}nav{display:flex;gap:4px}nav button{background:transparent;color:#dce2e5;border:0;border-bottom:3px solid transparent;border-radius:0;height:58px}
    nav button.active{color:#fff;border-bottom-color:#36c2a5}.status{margin-left:auto;font-size:14px;display:flex;gap:12px;align-items:center}
    main{max-width:1400px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}
    .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar h2{font-size:20px;margin:0 auto 0 0}
    .panel{background:#fff;border:1px solid #d3dade;border-radius:6px;padding:15px}.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px;border-bottom:1px solid #e0e5e8;font-size:14px}th{background:#f5f7f8}
    .actions{display:flex;gap:6px;flex-wrap:wrap}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:13px;color:#4d5b63}
    .step{border-top:1px solid #dce2e5;padding:12px 0;display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:start}
    .step-fields{display:flex;gap:8px;flex-wrap:wrap}.step-fields input,.step-fields select{max-width:220px}.parallel{background:#f4f8f7;padding:8px;border-left:3px solid #2a8d79}
    .message{position:fixed;right:18px;bottom:18px;padding:11px 15px;background:#20282d;color:#fff;border-radius:5px;display:none;max-width:420px}
    .modal{position:fixed;inset:0;background:#20282dee;display:flex;align-items:center;justify-content:center;z-index:5}.modal form{width:min(380px,90vw);background:#fff;padding:24px;border-radius:6px}.modal h2{margin-top:0}
    textarea{width:100%;min-height:100px}.muted{color:#65737b;font-size:13px}.hidden{display:none!important}
    @media(max-width:800px){header{height:auto;align-items:flex-start;flex-direction:column;padding:12px}nav{width:100%;overflow:auto}nav button{height:42px}.status{margin-left:0}.grid{grid-template-columns:1fr}main{padding:10px}.step{grid-template-columns:1fr}.step-fields input,.step-fields select{max-width:100%;width:100%}}
  </style>
</head>
<body>
<header><h1>KRT Robot Console</h1><nav id="nav"></nav><div class="status"><span id="execStatus">空闲</span><button id="cancelBtn" class="danger" disabled>停止</button><span id="who"></span><button id="logoutBtn">退出</button></div></header>
<main>
  <section id="waypoints" class="view"><div class="toolbar"><h2>点位</h2><input id="waypointName" placeholder="点位名称"><select id="waypointRoutine"></select><button id="markBtn" class="primary">记录当前位置</button></div><table><thead><tr><th>名称</th><th>位置</th><th>Routine</th><th>操作</th></tr></thead><tbody id="waypointRows"></tbody></table></section>
  <section id="routines" class="view"><div class="toolbar"><h2>动作编排</h2><button id="newRoutine">新建</button><button id="saveRoutine" class="primary">保存</button><button id="runRoutine">试运行</button><button id="deleteRoutine" class="danger">删除</button></div><div class="grid"><div class="panel"><div id="routineList"></div></div><div class="panel"><div class="field"><label>Routine 名称</label><input id="routineName" maxlength="80"></div><div id="steps"></div><div class="actions"><select id="addType"><option value="speak">语音播报</option><option value="play_audio">播放音乐</option><option value="arm_group">机械臂动作组</option><option value="gripper">夹爪</option><option value="wait">等待</option><option value="photo">拍照</option><option value="describe">视觉描述</option><option value="parallel">并行组</option></select><button id="addStep">添加步骤</button></div></div></div></section>
  <section id="actionGroups" class="view"><div class="toolbar"><h2>动作组</h2></div><table><thead><tr><th>名称</th><th>机械臂</th><th>采样</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="actionGroupRows"></tbody></table></section>
  <section id="media" class="view"><div class="toolbar"><h2>音乐</h2><input id="mediaFile" type="file" accept="audio/wav,.wav"><button id="uploadMedia" class="primary">上传 WAV</button></div><table><thead><tr><th>名称</th><th>时长</th><th>格式</th><th>大小</th><th>操作</th></tr></thead><tbody id="mediaRows"></tbody></table></section>
  <section id="users" class="view"><div class="toolbar"><h2>账号</h2><input id="newUsername" placeholder="用户名"><input id="newPassword" type="password" placeholder="至少 10 位密码"><select id="newRole"><option value="operator">操作员</option><option value="admin">管理员</option></select><button id="addUser" class="primary">创建</button></div><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table><h3>最近审计</h3><table><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>对象</th><th>结果</th></tr></thead><tbody id="auditRows"></tbody></table></section>
</main>
<div id="login" class="modal"><form id="loginForm"><h2>登录机器人控制台</h2><div class="field"><label>用户名</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">登录</button></form></div>
<div id="message" class="message"></div>
<script>
let csrf='', user=null, routines=[], media=[], actionGroups=[], selected=null, model={type:'sequence',steps:[]};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-CSRF-Token':csrf};if(opt.json!==undefined){opt.body=JSON.stringify(opt.json);opt.headers['Content-Type']='application/json'}const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d}
function msg(text){$('message').textContent=text;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',3000)}
function tabs(){const names=[['waypoints','点位'],['routines','动作编排'],['actionGroups','动作组'],['media','音乐'],...(user?.role==='admin'?[['users','账号']]:[])];$('nav').innerHTML=names.map((x,i)=>`<button data-view="${x[0]}" class="${i?'':'active'}">${x[1]}</button>`).join('');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(names[0][0]).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');if(b.dataset.view==='users')loadUsers()})}
async function boot(){const s=await api('/api/session');csrf=s.csrf_token;user=s.user;$('login').classList.toggle('hidden',!!user);if(!user)return;$('who').textContent=`${user.username} · ${user.role}`;tabs();await refreshAll();setInterval(status,1000)}
async function refreshAll(){[routines,media,actionGroups]=await Promise.all([api('/api/routines'),api('/api/media'),api('/api/action-groups')]);renderRoutineList();renderActionGroups();renderMedia();await loadWaypoints()}
async function loadWaypoints(){const rows=await api('/api/waypoints');$('waypointRoutine').innerHTML='<option value="">不绑定动作</option>'+routines.map(r=>`<option>${esc(r.name)}</option>`).join('');$('waypointRows').innerHTML=rows.map(w=>`<tr><td>${esc(w.name)}</td><td>${w.x.toFixed(2)}, ${w.y.toFixed(2)}</td><td><select data-bind="${esc(w.name)}"><option value="">-</option>${routines.map(r=>`<option ${r.name===w.routine?'selected':''}>${esc(r.name)}</option>`).join('')}</select></td><td class="actions"><button data-runwp="${esc(w.name)}">执行</button><button class="danger" data-delwp="${esc(w.name)}">删除</button></td></tr>`).join('');document.querySelectorAll('[data-bind]').forEach(x=>x.onchange=()=>api(`/api/waypoints/${encodeURIComponent(x.dataset.bind)}`,{method:'PATCH',json:{routine:x.value}}).then(()=>msg('绑定已更新')).catch(e=>msg(e.message)));document.querySelectorAll('[data-runwp]').forEach(x=>x.onclick=()=>api(`/api/waypoints/${encodeURIComponent(x.dataset.runwp)}/run`,{method:'POST'}).then(()=>msg('已开始执行')).catch(e=>msg(e.message)));document.querySelectorAll('[data-delwp]').forEach(x=>x.onclick=()=>confirm('删除点位？')&&api(`/api/waypoints/${encodeURIComponent(x.dataset.delwp)}`,{method:'DELETE'}).then(loadWaypoints).catch(e=>msg(e.message)))}
function renderRoutineList(){ $('routineList').innerHTML=routines.map(r=>`<button style="width:100%;margin-bottom:6px;text-align:left" data-routine="${esc(r.name)}">${esc(r.name)}</button>`).join('')||'<span class="muted">暂无 routine</span>';document.querySelectorAll('[data-routine]').forEach(x=>x.onclick=()=>selectRoutine(x.dataset.routine))}
function renderActionGroups(){$('actionGroupRows').innerHTML=actionGroups.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.arm_target)}</td><td>${g.sample_count}</td><td>${esc(g.created_at)}</td><td><button data-renamegroup="${esc(g.name)}">改名</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无动作组</td></tr>';document.querySelectorAll('[data-renamegroup]').forEach(x=>x.onclick=()=>{const name=prompt('动作组新名称',x.dataset.renamegroup);if(name&&name!==x.dataset.renamegroup)api(`/api/action-groups/${encodeURIComponent(x.dataset.renamegroup)}`,{method:'PATCH',json:{name}}).then(refreshAll).catch(e=>msg(e.message))})}
function selectRoutine(name){const r=routines.find(x=>x.name===name);selected=name;$('routineName').value=name;$('routineName').disabled=true;model=structuredClone(r.spec);renderSteps()}
function fresh(type){if(type==='speak')return{type,text:''};if(type==='play_audio')return{type,media_key:media[0]?.media_key||''};if(type==='arm_group')return{type,arm_target:'left',group_name:'',repeat_count:1};if(type==='gripper')return{type,side:'left',finger_id:0,position:0,speed:500,force:85,wait_time:10};if(type==='wait')return{type,wait_ms:500};if(type==='describe')return{type,camera_id:'head',question:'请描述你看到的内容'};if(type==='parallel')return{type,steps:[]};return{type}}
function fields(step,i,child=''){const key=`${i}${child}`;const input=(n,v,t='text',min='',max='')=>`<label>${n}<input data-key="${key}" data-field="${n}" type="${t}" value="${esc(v)}" min="${min}" max="${max}"></label>`;if(step.type==='speak')return input('text',step.text);if(step.type==='play_audio')return `<label>media_key<select data-key="${key}" data-field="media_key">${media.map(m=>`<option value="${m.media_key}" ${m.media_key===step.media_key?'selected':''}>${esc(m.display_name)}</option>`).join('')}</select></label>`;if(step.type==='arm_group'){const groups=actionGroups.map(g=>`<option value="${esc(g.name)}" ${g.name===step.group_name?'selected':''}>${esc(g.name)}${g.arm_target==='unknown'?'（请选择机械臂）':''}</option>`).join('');return `<label>动作组<select data-key="${key}" data-field="group_name"><option value="">请选择</option>${groups}</select></label><label>arm_target<select data-key="${key}" data-field="arm_target">${['left','right','both'].map(v=>`<option ${v===step.arm_target?'selected':''}>${v}</option>`).join('')}</select></label>`+input('repeat_count',step.repeat_count,'number',1,100)}if(step.type==='gripper')return `<label>side<select data-key="${key}" data-field="side"><option ${step.side==='left'?'selected':''}>left</option><option ${step.side==='right'?'selected':''}>right</option></select></label>`+input('finger_id',step.finger_id,'number',0,3)+input('position',step.position,'number',0,1000)+input('speed',step.speed,'number',0,1000)+input('force',step.force,'number',0,255)+input('wait_time',step.wait_time,'number',0,255);if(step.type==='wait')return input('wait_ms',step.wait_ms,'number',0,3600000);if(step.type==='describe')return input('camera_id',step.camera_id)+input('question',step.question);return''}
function renderSteps(){ $('steps').innerHTML=model.steps.map((s,i)=>`<div class="step"><strong>${esc(s.type)}</strong><div class="step-fields">${fields(s,i)}${s.type==='parallel'?`<div class="parallel">${s.steps.map((c,j)=>`<div class="step"><strong>${esc(c.type)}</strong><div class="step-fields">${fields(c,i,':'+j)}</div><button data-delchild="${i}:${j}">删除</button></div>`).join('')}<select data-paralleltype="${i}"><option value="play_audio">音乐</option><option value="arm_group">机械臂</option><option value="gripper">夹爪</option><option value="wait">等待</option></select><button data-addchild="${i}">添加并行项</button></div>`:''}</div><div class="actions"><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-delstep="${i}">删除</button></div></div>`).join('');bindStepEvents()}
function bindStepEvents(){document.querySelectorAll('[data-field]').forEach(x=>x.onchange=()=>{const[a,b]=x.dataset.key.split(':').map(Number),o=Number.isInteger(b)?model.steps[a].steps[b]:model.steps[a];o[x.dataset.field]=x.type==='number'?Number(x.value):x.value;if(x.dataset.field==='group_name'){const group=actionGroups.find(g=>g.name===x.value);if(group&&group.arm_target!=='unknown')o.arm_target=group.arm_target;renderSteps()}});document.querySelectorAll('[data-delstep]').forEach(x=>x.onclick=()=>{model.steps.splice(+x.dataset.delstep,1);renderSteps()});document.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(+x.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(+x.dataset.down,1));document.querySelectorAll('[data-addchild]').forEach(x=>x.onclick=()=>{const i=+x.dataset.addchild,t=document.querySelector(`[data-paralleltype="${i}"]`).value;model.steps[i].steps.push(fresh(t));renderSteps()});document.querySelectorAll('[data-delchild]').forEach(x=>x.onclick=()=>{const[i,j]=x.dataset.delchild.split(':').map(Number);model.steps[i].steps.splice(j,1);renderSteps()})}
function move(i,d){const n=i+d;if(n<0||n>=model.steps.length)return;[model.steps[i],model.steps[n]]=[model.steps[n],model.steps[i]];renderSteps()}
function renderMedia(){$('mediaRows').innerHTML=media.map(m=>`<tr><td>${esc(m.display_name)}</td><td>${m.duration_sec.toFixed(1)} 秒</td><td>${m.sample_rate} Hz / ${m.channels} 声道</td><td>${(m.size_bytes/1048576).toFixed(1)} MB</td><td><button class="danger" data-delmedia="${m.media_key}">删除</button></td></tr>`).join('');document.querySelectorAll('[data-delmedia]').forEach(x=>x.onclick=()=>confirm('删除音乐？')&&api(`/api/media/${x.dataset.delmedia}`,{method:'DELETE'}).then(refreshAll).catch(e=>msg(e.message)))}
async function loadUsers(){const [u,a]=await Promise.all([api('/api/users'),api('/api/audit-logs')]);$('userRows').innerHTML=u.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.role}</td><td>${x.enabled?'启用':'禁用'}</td><td><button data-toggle="${x.id}" data-enabled="${x.enabled}">${x.enabled?'禁用':'启用'}</button></td></tr>`).join('');document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>api(`/api/users/${x.dataset.toggle}`,{method:'PATCH',json:{enabled:!Number(x.dataset.enabled)}}).then(loadUsers).catch(e=>msg(e.message)));$('auditRows').innerHTML=a.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.username)}</td><td>${esc(x.action)}</td><td>${esc(x.object_name)}</td><td>${x.success?'成功':'失败'}</td></tr>`).join('')}
async function status(){if(!user)return;const s=await api('/api/execution');$('execStatus').textContent=s.status==='running'?`${s.mode} · ${s.current_step||'执行中'}`:s.status;$('cancelBtn').disabled=s.status!=='running'}
$('loginForm').onsubmit=e=>{e.preventDefault();api('/api/login',{method:'POST',json:{username:$('loginUser').value,password:$('loginPassword').value}}).then(s=>{csrf=s.csrf_token;user=s.user;$('login').classList.add('hidden');$('who').textContent=`${user.username} · ${user.role}`;tabs();refreshAll();setInterval(status,1000)}).catch(e=>msg(e.message))};$('logoutBtn').onclick=()=>api('/api/logout',{method:'POST'}).then(()=>location.reload());$('cancelBtn').onclick=()=>api('/api/execution/cancel',{method:'POST'}).catch(e=>msg(e.message));$('markBtn').onclick=()=>api('/api/waypoints',{method:'POST',json:{name:$('waypointName').value,routine:$('waypointRoutine').value}}).then(loadWaypoints).catch(e=>msg(e.message));$('newRoutine').onclick=()=>{selected=null;$('routineName').disabled=false;$('routineName').value='';model={type:'sequence',steps:[]};renderSteps()};$('addStep').onclick=async()=>{if($('addType').value==='arm_group')actionGroups=await api('/api/action-groups');model.steps.push(fresh($('addType').value));renderSteps()};$('saveRoutine').onclick=()=>{const n=$('routineName').value.trim();api(`/api/routines/${encodeURIComponent(n)}`,{method:'PUT',json:model}).then(refreshAll).then(()=>selectRoutine(n)).catch(e=>msg(e.message))};$('runRoutine').onclick=()=>api(`/api/routines/${encodeURIComponent($('routineName').value)}/run`,{method:'POST'}).catch(e=>msg(e.message));$('deleteRoutine').onclick=()=>selected&&confirm('删除 routine？')&&api(`/api/routines/${encodeURIComponent(selected)}`,{method:'DELETE'}).then(refreshAll).catch(e=>msg(e.message));$('uploadMedia').onclick=()=>{const f=$('mediaFile').files[0];if(!f)return msg('请选择 WAV');const d=new FormData();d.append('file',f);api('/api/media',{method:'POST',body:d}).then(refreshAll).catch(e=>msg(e.message))};$('addUser').onclick=()=>api(`/api/users`,{method:'POST',json:{username:$('newUsername').value,password:$('newPassword').value,role:$('newRole').value}}).then(loadUsers).catch(e=>msg(e.message));boot().catch(e=>msg(e.message));
</script>
</body></html>
